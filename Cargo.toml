[package]
name = "tiny-station"
version = "0.3.0"
edition = "2021"
description = "Logical mesh proxy network: any tiny-station node can relay requests through the whole mesh."

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls", "http2", "charset"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
bincode = "1.3"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
mlua = { version = "0.12.2", features = ["luau", "serialize"] }
hmac = "0.12"
ed25519-dalek = "2"
