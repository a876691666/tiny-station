[package]
name = "tiny-station"
version = "0.2.0"
edition = "2021"
description = "Logical mesh proxy network: any tiny-station node can relay requests through the whole mesh."

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls", "http2", "charset"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
