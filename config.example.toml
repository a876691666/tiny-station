# tiny-station 示例配置
#
# 通常只需要一个 IP 地址。首次运行会从下面 5 个默认端口里选一个空闲端口绑定,
# 并自动把所选端口写入 `port` 固定下来;之后每次启动都用该端口,不再漂移。
# 扫描其它节点时仍会尝试全部 5 个端口。
#
# 注意:在 TOML 中,普通键必须写在所有 [表] 之前,否则会被归到最近的表里。
# 请把所有根级键放在 [[proxies]] 和 [[peers]] 之上。

name = "cloud"
# ip = "203.0.113.5"        # 对外广播的 IP;不填自动探测内网地址
# bind = "0.0.0.0"          # 本地绑定网卡,默认 0.0.0.0
# ports = [45910, 45911, 45912, 45913, 45914]   # 扫描端口列表
# port = 45910              # 固定监听端口(首次运行后自动写入,一般无需手改)

# --- 账号密码 -----------------------------------------------------------
# 其它节点访问本节点时需要提供的组网账号密码。
api_username = "mesh"
api_password = "123456"

# 网页管理界面的账号密码(不填则复用上面的组网账号)。
admin_username = "admin"
admin_password = "123456"

# 无需鉴权的普通 IP(会被扫描,不带账号密码)。
seeds = []

# 本节点是否能直连外网。若本机有出口或下面配了代理,可设为 true。
internet = false

# 只有本节点能直达的主机 / 网段 / 通配符;其它节点请求会自动路由过来。
reachable = ["192.168.1.0/24", "*.internal.example.com"]

# 发现 / 心跳 / 广播 的间隔秒数(默认 5)。
gossip_interval_secs = 5

# --- 本机出口代理 -------------------------------------------------------
# 其它节点可用 ?via=名称 借用;支持 http 与 socks5(clash / v2ray)。
[[proxies]]
name = "clash"
kind = "http"
url = "http://127.0.0.1:7890"

# --- 组网目标服务(地址 + 账号 + 密码)---------------------------------
# 这里的账号密码是【对方节点的 api 组网账号】。
# address 可写 "ip"(自动扫描端口)或 "ip:端口"。
[[peers]]
address = "192.168.1.10"     # 家里电脑(服务 2)
name = "home"
username = "mesh"
password = "对方home节点的组网密码"

[[peers]]
address = "192.168.1.66"     # 内网机器(服务 3),可经 home 多跳到达
name = "lan-web"
username = "mesh"
password = "对方lan节点的组网密码"
