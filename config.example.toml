# tiny-station 示例配置
#
# 通常只需要一个 IP 地址。首次运行会从下面 5 个默认端口里选一个空闲端口绑定,
# 并自动把所选端口写入 `port` 固定下来;之后每次启动都用该端口,不再漂移。
# 扫描其它节点时仍会尝试全部 5 个端口。
#
# 注意:在 TOML 中,普通键必须写在所有 [表] 之前,否则会被归到最近的表里。
# 请把所有根级键放在 [[proxies]] 和 [[peers]] 之上。

name = "cloud"
# ip = "203.0.113.5"        # 对外广播的 IP;不填自动探测内网地址
# bind = "0.0.0.0"          # 本地绑定网卡,默认 0.0.0.0
# ports = [45910, 45911, 45912, 45913, 45914]   # 扫描端口列表
# port = 45910              # 固定监听端口(首次运行后自动写入,一般无需手改)

# --- 全网统一根密钥 / 入网密钥(必填)------------------------------------
# 所有节点必须填写【完全相同】的值。节点间通讯强制加密:
#   - 心跳/控制面(gossip、探活、可达发现)用私有二进制编码;
#   - 代理请求/数据面(tunnel、反向通道)用配对会话密钥加密(XChaCha20-Poly1305)。
# 本密钥只用于握手认证(PSK)与入网,不直接加密消息。发送方与接收方在握手中
# 用【自动生成的身份密钥 + 临时 ECDH】协商出会话密钥 —— 无需为每个节点单独
# 生成/分发密钥。另有一个可轮换的 cluster key,通过 POST /api/rotate 设置并
# 自动广播全网;后加入的节点在入网握手中自动同步最新 cluster key。
# 首次运行会自动生成一串随机值,复制到其它节点即可;不设置将拒绝启动。
mesh_key = "在这里填入全网统一的根密钥"

# --- 账号密码 -----------------------------------------------------------
# 其它节点访问本节点时需要提供的组网账号密码(额外的 Basic 认证;
# 真正的机密性/完整性由上面的 mesh_key 保证)。
api_username = "mesh"
api_password = "123456"

# 网页管理界面的账号密码(不填则复用上面的组网账号)。
admin_username = "admin"
admin_password = "123456"

# 无需鉴权的普通 IP(会被扫描,不带账号密码)。
# 注意:加密是全网统一的(mesh_key),seeds 与 peers 一样必须共享同一 mesh_key。
seeds = []

# 本节点是否能直连外网。若本机有出口或下面配了代理,可设为 true。
internet = false

# 只有本节点能直达的主机 / 网段 / 通配符;其它节点请求会自动路由过来。
reachable = ["192.168.1.0/24", "*.internal.example.com"]

# 发现 / 心跳 / 广播 的间隔秒数(默认 5)。
gossip_interval_secs = 5

# --- 可热替换内核(可选)-------------------------------------------------
# 内核是「模块集合」:入口 main.lua + 任意数量的 require 模块(沙箱内解析,
# 无文件系统)。默认读取配置同目录下的 .<配置名>.kernel/ 目录(存在即自动加载);
# kernel_file 指向 .lua 文件时按单文件内核处理。
# 运行时可经 POST /api/kernel 上传(纯文本=main.lua;JSON {entry,files}=整包)。
# kernel_file = "kernel.lua"     # 指定入口文件(单文件模式);不填用上面的目录
# kernel_workers = 1             # 独立 Lua 虚拟机(工作线程)数量,默认 1

# 内核全网签名分发的发布公钥(Ed25519,hex)。默认情况下节点信任已加密认证的 mesh
# 会话(开箱即用);配置本项后则只接受由它签名的内核 bundle(可选加固)。
# 用 `tiny-station keygen` 生成密钥对,`tiny-station sign` 生成签名 bundle。
# 私钥务必只留在 CI / 本机,切勿放到任何节点上。
# release_pubkey = "<公钥 hex>"

# --- 本机出口代理 -------------------------------------------------------
# 其它节点可用 ?via=名称 借用;支持 http 与 socks5(clash / v2ray)。
[[proxies]]
name = "clash"
kind = "http"
url = "http://127.0.0.1:7890"

# --- 组网目标服务(地址 + 账号 + 密码)---------------------------------
# 这里的账号密码是【对方节点的 api 组网账号】。
# address 可写 "ip"(自动扫描端口)或 "ip:端口"。
[[peers]]
address = "192.168.1.10"     # 家里电脑(服务 2)
name = "home"
username = "mesh"
password = "对方home节点的组网密码"

[[peers]]
address = "192.168.1.66"     # 内网机器(服务 3),可经 home 多跳到达
name = "lan-web"
username = "mesh"
password = "对方lan节点的组网密码"
